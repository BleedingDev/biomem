name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/pyproject.toml

      - name: Install Linux GUI runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.12.1+cpu"
          python -m pip install -e "src[all]" pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Check Python syntax
        run: python -m compileall -q src tests scripts

  package:
    name: Build Python distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/pyproject.toml

      - name: Build exactly one wheel and one source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build src --sdist --wheel --outdir dist
          python - <<'PY'
          from pathlib import Path

          artifacts = sorted(path for path in Path("dist").iterdir() if path.is_file())
          wheels = [path for path in artifacts if path.suffix == ".whl"]
          sdists = [path for path in artifacts if path.name.endswith(".tar.gz")]
          assert len(artifacts) == 2, [path.name for path in artifacts]
          assert len(wheels) == 1, [path.name for path in artifacts]
          assert len(sdists) == 1, [path.name for path in artifacts]
          PY
          python -m twine check dist/*

  python-compatibility:
    name: Python ${{ matrix.python }} package compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: src/pyproject.toml

      - name: Build and install the package with CPU-only runtime dependencies
        run: |
          python -m pip install --upgrade build pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.12.1+cpu"
          python -m build src --wheel --outdir dist
          python -m pip install dist/*.whl
          python -m pip check
          python -m compileall -q src
          python -c "from pathlib import Path; import importlib.metadata as m, memory_module, torch; from memory_module.cli import create_parser; assert m.version('biomem-memory') == '0.0.2'; assert Path('src').resolve() not in Path(memory_module.__file__).resolve().parents; assert torch.version.cuda is None and not torch.cuda.is_available(); assert create_parser().parse_args(['store', 'compat-key', 'compat-value']).command == 'store'"

  platform-smoke:
    name: Smoke (${{ matrix.target }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            python: '3.13'
          - os: ubuntu-24.04-arm
            target: linux-arm64
            python: '3.13'
          - os: windows-2025
            target: windows-x86_64
            python: '3.13'
          - os: macos-15-intel
            target: macos-x86_64
            python: '3.12'
          - os: macos-15
            target: macos-arm64
            python: '3.13'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: src/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install exact CPU-only Torch on Linux and Windows
        if: runner.os != 'macOS'
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          "torch==2.12.1+cpu"

      - name: Install CPU-only Torch on macOS
        if: runner.os == 'macOS'
        run: >-
          python -m pip install
          "torch==${{ matrix.target == 'macos-x86_64' && '2.2.2' || '2.12.1' }}"

      - name: Install package dependencies without replacing Torch
        run: |
          python -m pip install -e "src[all]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run cross-platform product smoke
        run: |
          python tests/test_smoke.py
          python tests/release/ci_platform_smoke.py

  extensions:
    name: Extension contracts and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Install test dependencies
        run: python -m pip install pytest "websockets>=12"

      - name: Run extension tests
        run: >-
          python -m pytest -q
          tests/extension_contract
          tests/extension_runtime/test_run_fixture_classification.py

      - name: Validate and package Chromium and Firefox
        run: |
          ./scripts/build_extensions.sh --validate-only
          ./scripts/build_extensions.sh --no-crx --no-safari --prefix=ci
          unzip -t dist/chrome-ci.zip
          unzip -t dist/firefox-ci-unsigned.xpi

  safari-development-build:
    name: Safari development build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and verify development-only Safari artifact
        env:
          BIOMEM_SAFARI_ARCHS: arm64 x86_64
        run: |
          ./scripts/build_extensions.sh \
            --safari-mode=development \
            --no-crx \
            --prefix=ci
          unzip -t dist/safari-ci-macos-development-adhoc.zip
          unzip -p dist/safari-ci-macos-development-adhoc.zip DEVELOPMENT-ONLY.json \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["distributable"] is False'

  lint:
    name: Release-blocking Python lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check release-blocking Python errors
        run: ruff check --select E9,F63,F7,F82 src tests scripts
