name: Reusable canonical release publication

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean
    secrets:
      IMMUTABLE_RELEASES_TOKEN:
        required: false

permissions: {}

jobs:
  assemble:
    name: Assemble exact canonical artifact set
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Download producer artifact bundles without merging
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-core-*
          path: incoming/bundles
      - name: Download producer digests without merging
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: producer-digest-*
          path: incoming/digests
      - name: Download resolved policy
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-policy
          path: policy
      - name: Download optional channel evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-channel-evidence
          path: channel-evidence
      - name: Download the exact current-run public Chrome handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-ready-chrome-current-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming/browser-chrome/browser-ready-chrome-current-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Download the exact current-run Firefox handoff envelope
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-firefox-current-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming/browser-firefox/browser-firefox-current-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify source pin, producer digests, browser handoffs, allowlists, and collisions
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          python3 - "$RELEASE_TAG" <<'PY'
          import json
          from pathlib import Path
          import sys
          if json.loads(Path("policy/release-policy.json").read_text())["tag"] != sys.argv[1]:
              raise SystemExit("downloaded release policy tag does not match workflow input")
          PY
          python scripts/release/canonical_artifacts.py assemble \
            --policy policy/release-policy.json \
            --source-sha "$SOURCE_SHA" \
            --bundles-dir incoming/bundles \
            --digests-dir incoming/digests \
            --output-dir core-assets
          python scripts/release/canonical_artifacts.py assemble-publication-assets \
            --policy policy/release-policy.json \
            --source-sha "$SOURCE_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --core-dir core-assets \
            --chrome-downloads-dir incoming/browser-chrome \
            --firefox-downloads-dir incoming/browser-firefox \
            --evidence-dir channel-evidence \
            --output-dir canonical-assets
      - name: Exercise the complete no-write preflight
        if: inputs.dry_run
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-preflight
          python scripts/release/canonical_artifacts.py checksums \
            --policy policy/release-policy.json \
            --artifacts-dir canonical-assets \
            --output release-preflight/SHA256SUMS.txt
          python scripts/release_policy.py preflight \
            --policy policy/release-policy.json \
            --evidence-dir channel-evidence \
            --artifacts-dir canonical-assets \
            --source-sha "$SOURCE_SHA" \
            --output release-preflight/release-preflight.json
          if find release-preflight -name release-manifest.json -print -quit | grep -q .; then
            echo 'Dry run created a forbidden release-manifest.json.' >&2
            exit 1
          fi
          if grep -R '"status": "published"' release-preflight; then
            echo 'Dry run made a forbidden publication claim.' >&2
            exit 1
          fi
      - name: Upload the exact canonical distributable set for provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-release-assets
          path: canonical-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload dry-run evidence only
        if: inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preflight
          path: release-preflight/*
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest every distributable asset
    if: ${{ !inputs.dry_run }}
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Require tag-bound Actions context for provenance
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == "refs/tags/$RELEASE_TAG" ]]
          [[ "$WORKFLOW_SHA" == "$SOURCE_SHA" ]]
      - name: Download the verified canonical distributable set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canonical-release-assets
          path: canonical-assets
      - name: Generate GitHub build-provenance attestations
        id: provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: canonical-assets/*
      - name: Record verified provenance receipt
        env:
          ATTESTATION_RECEIPT: ${{ steps.provenance.outputs.attestation-url }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ATTESTATION_RECEIPT" ]]; then
            echo 'BLOCKED_ENVIRONMENT: GitHub returned no attestation receipt.' >&2
            exit 1
          fi
          python3 - "$SOURCE_SHA" "$ATTESTATION_RECEIPT" <<'PY'
          import json
          from pathlib import Path
          import sys
          Path("provenance-evidence.json").write_text(json.dumps({
              "status": "published",
              "source_sha": sys.argv[1],
              "provider": "github_actions_build_provenance",
              "receipt": sys.argv[2],
          }, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload provenance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance-evidence
          path: provenance-evidence.json
          if-no-files-found: error
          retention-days: 14

  prepare:
    name: Prepare immutable publication payload
    if: ${{ !inputs.dry_run }}
    needs: [assemble, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Download the verified canonical distributable set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canonical-release-assets
          path: canonical-assets
      - name: Download resolved policy
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-policy
          path: policy
      - name: Download optional channel evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-channel-evidence
          path: channel-evidence
      - name: Download provenance evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-provenance-evidence
          path: provenance
      - name: Build and re-verify manifest, checksums, and release notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          python3 - "$RELEASE_TAG" <<'PY'
          import json
          from pathlib import Path
          import sys
          if json.loads(Path("policy/release-policy.json").read_text())["tag"] != sys.argv[1]:
              raise SystemExit("downloaded release policy tag does not match workflow input")
          PY
          python scripts/release/canonical_artifacts.py prepare-payload \
            --policy policy/release-policy.json \
            --source-sha "$SOURCE_SHA" \
            --repository "$REPOSITORY" \
            --artifacts-dir canonical-assets \
            --evidence-dir channel-evidence \
            --provenance-evidence provenance/provenance-evidence.json \
            --output-dir publication
          python scripts/release_policy.py check-manifest \
            --manifest publication/payload/release-manifest.json
          python scripts/release/canonical_artifacts.py verify-payload \
            --policy policy/release-policy.json \
            --source-sha "$SOURCE_SHA" \
            --repository "$REPOSITORY" \
            --payload-dir publication/payload
      - name: Upload exact publication payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-release-publication
          path: |
            publication/payload
            publication/release-notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish owned draft exactly once
    if: ${{ !inputs.dry_run }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require tag-bound Actions context for publication
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == "refs/tags/$RELEASE_TAG" ]]
          [[ "$WORKFLOW_SHA" == "$SOURCE_SHA" ]]
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Download resolved policy
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-policy
          path: policy
      - name: Download exact publication payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canonical-release-publication
          path: publication
      - name: Verify exact inventory and publish the owned draft once
        env:
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASES_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          python3 - "$RELEASE_TAG" <<'PY'
          import json
          from pathlib import Path
          import sys
          if json.loads(Path("policy/release-policy.json").read_text())["tag"] != sys.argv[1]:
              raise SystemExit("downloaded release policy tag does not match workflow input")
          PY
          python scripts/release/publish_github_release.py \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --policy policy/release-policy.json \
            --source-sha "$SOURCE_SHA" \
            --payload-dir publication/payload \
            --release-notes publication/release-notes.md

  dispatch:
    name: Notify downstream consumers after immutable publication
    if: ${{ !inputs.dry_run }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require tag-bound Actions context for dispatch
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == "refs/tags/$RELEASE_TAG" ]]
          [[ "$WORKFLOW_SHA" == "$SOURCE_SHA" ]]
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Download resolved policy
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-policy
          path: policy
      - name: Download exact publication payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canonical-release-publication
          path: publication
      - name: Re-verify immutable release and dispatch exact identity
        env:
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASES_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          python3 - "$RELEASE_TAG" <<'PY'
          import json
          from pathlib import Path
          import sys
          if json.loads(Path("policy/release-policy.json").read_text())["tag"] != sys.argv[1]:
              raise SystemExit("downloaded release policy tag does not match workflow input")
          PY
          python scripts/release/publish_github_release.py \
            --operation dispatch \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --policy policy/release-policy.json \
            --source-sha "$SOURCE_SHA" \
            --payload-dir publication/payload \
            --release-notes publication/release-notes.md
